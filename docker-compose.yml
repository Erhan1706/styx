services:
  coordinator:
    build:
      context: .
      dockerfile: coordinator/coordinator.dockerfile
      args:
        install_autoscale: ${ENABLE_AUTOSCALE:-false}
    image: dev/styx-coordinator:latest
    ports:
      - "8886:8888"
      - "8000:8000"
    environment:
      KAFKA_URL: kafka1:19092
      HEARTBEAT_LIMIT: "5000"
      HEARTBEAT_CHECK_INTERVAL: "500"
      ENABLE_AUTOSCALE: ${ENABLE_AUTOSCALE:-true}
      MIGRATION_COLD_START_HORIZON_SEC: ${MIGRATION_COLD_START_HORIZON_SEC:-25}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
    depends_on:
      - prometheus
      - grafana

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:11.5.2-ubuntu
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin  # Optional: Grant Admin rights to anonymous users
      - GF_AUTH_DISABLE_LOGIN_FORM=true   # Optional: Hide the login form
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning  # Auto-config
      - ./grafana/dashboards:/etc/grafana/dashboards      # Load dashboards

  worker:
    build:
      context: .
      dockerfile: worker/worker.dockerfile
    image: dev/styx-worker:latest
    environment:
      - INGRESS_TYPE=KAFKA
      - KAFKA_URL=kafka1:19092
      - DISCOVERY_HOST=coordinator
      - DISCOVERY_PORT=8888
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
    depends_on:
      - coordinator
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "8GB"

  worker-standby:
    profiles:
      - autoscale
    build:
      context: .
      dockerfile: worker/worker.dockerfile
    image: dev/styx-worker-standby:latest
    environment:
      - INGRESS_TYPE=KAFKA
      - KAFKA_URL=kafka1:19092
      - DISCOVERY_HOST=coordinator
      - DISCOVERY_PORT=8888
      - STYX_START_FILE=/tmp/styx_start
      - WORKER_STANBY=true
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
    depends_on:
      - coordinator
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "8GB"

volumes:
  grafana_data:
